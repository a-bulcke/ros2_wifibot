ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true          # robot terrestre : on fige z, roll, pitch et leurs dérivées
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom         # pas de fusion GPS/map ici, juste odom local

    odom0: /odom
    # ordre des champs : x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data_raw
    # on ne fusionne QUE le cap (yaw) et la vitesse angulaire de lacet — pas l'accéléro
    # (bruit/vibrations du châssis dégraderaient l'estimation sur un robot à roues)
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true       # le cap absolu de l'IMU dérive (pas de vrai zéro), donc on fusionne relatif
    imu0_remove_gravitational_acceleration: true